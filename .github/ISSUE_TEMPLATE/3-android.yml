name: Android / tablet problem
description: The Android app won't install, open, or looks wrong (including Samsung DeX)
labels: ["bug", "area: android / DeX"]
body:
  - type: input
    id: device
    attributes:
      label: Tablet / phone model and Android version
      placeholder: "Galaxy Tab S9, Android 15"
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: How were you using it?
      options:
        - Normal (touch)
        - Samsung DeX
        - Both
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: App version
      placeholder: "1.3.0"
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: E.g. won't install, closes straight away, buttons too small, a file won't save. Screenshots help a lot.
    validations:
      required: true

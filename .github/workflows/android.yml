name: Android

# Builds the Android app (arm64 for tablets/phones, x86_64 for the emulator check)
# and launches the x86_64 build in an Android emulator to make sure it starts.
on:
  workflow_dispatch:
  workflow_call:

env:
  PYSIDE_VERSION: "6.10.3"
  NDK_VERSION: "26.1.10909125"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        arch: [aarch64, x86_64]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK packages (SDK is preinstalled on the runner)
        run: |
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platform-tools" "platforms;android-34" "build-tools;35.0.0" "ndk;${NDK_VERSION}" > /dev/null
          ls "$ANDROID_HOME/ndk"

      - name: Build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git zip unzip autoconf automake libtool \
            pkg-config zlib1g-dev libncurses5-dev libffi-dev libssl-dev cmake
          python -m pip install --upgrade pip
          python -m pip install "PySide6==${PYSIDE_VERSION}" buildozer==1.5.0 cython==0.29.33
          python tools/android/patch_deploy.py

      - name: Download Qt for Python Android wheels
        run: |
          base=https://download.qt.io/official_releases/QtForPython
          mkdir -p wheels
          curl -fsSL -o wheels/PySide6-${PYSIDE_VERSION}-${PYSIDE_VERSION}-cp311-cp311-android_${{ matrix.arch }}.whl \
            "$base/pyside6/PySide6-${PYSIDE_VERSION}-${PYSIDE_VERSION}-cp311-cp311-android_${{ matrix.arch }}.whl"
          curl -fsSL -o wheels/shiboken6-${PYSIDE_VERSION}-${PYSIDE_VERSION}-cp311-cp311-android_${{ matrix.arch }}.whl \
            "$base/shiboken6/shiboken6-${PYSIDE_VERSION}-${PYSIDE_VERSION}-cp311-cp311-android_${{ matrix.arch }}.whl"
          ls -la wheels

      - name: Build APK
        run: |
          pyside6-android-deploy -f --verbose --name ZafInventory \
            --wheel-pyside "$PWD/wheels/PySide6-${PYSIDE_VERSION}-${PYSIDE_VERSION}-cp311-cp311-android_${{ matrix.arch }}.whl" \
            --wheel-shiboken "$PWD/wheels/shiboken6-${PYSIDE_VERSION}-${PYSIDE_VERSION}-cp311-cp311-android_${{ matrix.arch }}.whl" \
            --ndk-path "$ANDROID_SDK_ROOT/ndk/${NDK_VERSION}" --sdk-path "$ANDROID_SDK_ROOT" \
            --extra-ignore-dirs tests,tools,wheels
          apk=$(find . -name "*.apk" -not -path "./.buildozer/*" | head -1)
          [ -n "$apk" ] || apk=$(find . -name "*.apk" | head -1)
          echo "built: $apk"
          name=ZafInventory-Android-arm64.apk
          [ "${{ matrix.arch }}" = "x86_64" ] && name=ZafInventory-Android-x86_64-emulator.apk
          cp "$apk" "$name"
          ls -la "$name"

      - uses: actions/upload-artifact@v4
        with:
          name: android-${{ matrix.arch }}
          path: ZafInventory-Android-*.apk
          if-no-files-found: error

  emulator:
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: android-x86_64
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Launch in emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: bash tools/android/emulator_test.sh ZafInventory-Android-x86_64-emulator.apk emulator-out
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: emulator-output
          path: emulator-out
